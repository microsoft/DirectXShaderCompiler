name: Update submodules

on:
  push:
    branches: [test/update-submodules]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-submodules

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    if: vars.SUBMODULE_UPDATER_CLIENT_ID != ''
    timeout-minutes: 30
    steps:
      - name: Get submodule updater app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SUBMODULE_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_UPDATER_PRIVATE_KEY }}

      - name: Fetch DirectXShaderCompiler sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Update submodules and open pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          git config user.name "$APP_BOT"
          git config user.email "$(gh api "users/$APP_BOT" --jq .id)+$APP_BOT@users.noreply.github.com"
          python3 .github/scripts/update_submodules.py --repo "$GITHUB_REPOSITORY"
