# -----------------------------------------------------------------------------
# DXC Submodule Update Pipeline
#
#   Daily, moves the external submodules to the latest upstream commit whose CI
#   is green and opens a pull request, or refreshes the one already open.
#
#   Requires a secret pipeline variable GitHubToken (a user token) that can
#   push branches and open pull requests in this repository.
# -----------------------------------------------------------------------------

name: Integration.SubmoduleUpdate.$(date:yy)-$(date:MM)-$(date:dd).$(rev:rr)

trigger: none
pr: none

schedules:
- cron: "0 12 * * *"
  displayName: Daily submodule update (12:00 UTC)
  branches:
    include:
    - main
  always: true

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
  submodules: false

- script: python3 azure-pipelines/scripts/update_submodules.py --repo "$(Build.Repository.Name)"
  displayName: Update submodules and open pull request
  env:
    GH_TOKEN: $(GitHubToken)
