name: Update submodules

on:
  push:
    branches: [test/update-submodules]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-submodules

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    if: github.repository == 'microsoft/DirectXShaderCompiler'
    timeout-minutes: 30
    steps:
      - name: Fetch DirectXShaderCompiler sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Update submodules and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/update_submodules.py --repo "$GITHUB_REPOSITORY"
