name: "Check code formatting"

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: clang-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code_formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch DirectXShaderCompiler sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout through merge base
        uses: rmacklin/fetch-through-merge-base@bfe4d03a86f9afa52bc1a70e9814fc92a07f7b75 # v0.3.0
        with:
          base_ref: ${{ github.event.pull_request.base.ref }}
          head_ref: ${{ github.event.pull_request.head.sha }}
          deepen_length: 500

      - name: Install clang-format
        uses: aminya/setup-cpp@8170d66c458f4a045220b7b0966c10940bb2a15d # v1.8.1
        with:
          clangformat: 17.0.1

      - name: Check code formatting
        env:
          START_REV: ${{ github.event.pull_request.base.sha }}
          END_REV: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          output_file="$(mktemp)"
          changed_files_file="$(mktemp)"
          trap 'rm -f "$output_file" "$changed_files_file"' EXIT

          git diff --name-only --diff-filter=ACMR -z \
            "$START_REV" \
            "$END_REV" \
            -- >"$changed_files_file"
          mapfile -d '' -t changed_files <"$changed_files_file"

          cpp_files=()
          for path in "${changed_files[@]}"; do
            case "$path" in
              *.cpp|*.c|*.h|*.hpp|*.hxx|*.cxx) cpp_files+=("$path") ;;
            esac
          done

          if [[ "${#cpp_files[@]}" -eq 0 ]]; then
            echo "[clang-format] no modified files to format"
            exit 0
          fi

          set +e
          git-clang-format \
            --diff \
            "$START_REV" \
            "$END_REV" \
            -- \
            "${cpp_files[@]}" >"$output_file" 2>&1
          formatter_status=$?
          set -e

          sed 's/^/[clang-format] /' "$output_file"
          if [[ "$formatter_status" -gt 1 ]]; then
            echo "::error::git-clang-format failed."
            exit "$formatter_status"
          fi

          if [[ "$formatter_status" -eq 1 ]] || grep -q '^diff --git ' "$output_file"; then
            echo "::error::C/C++ formatting changes are required. Run 'git clang-format $START_REV' locally and update the pull request."
            exit 1
          fi
