name: Update submodules

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-submodules

jobs:
  update-submodules:
    if: github.repository == 'microsoft/DirectXShaderCompiler' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_APP_CREDENTIALS: ${{ secrets.SUBMODULE_UPDATER_CLIENT_ID != '' && secrets.SUBMODULE_UPDATER_PRIVATE_KEY != '' }}
    steps:
      - name: Check submodule updater app credentials
        if: env.HAS_APP_CREDENTIALS != 'true'
        run: |
          echo "::error::SUBMODULE_UPDATER_CLIENT_ID and SUBMODULE_UPDATER_PRIVATE_KEY secrets must be set to update submodules."
          exit 1

      - name: Fetch DirectXShaderCompiler sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Get submodule updater app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SUBMODULE_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_UPDATER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update submodules and open pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          gh auth setup-git
          git config user.name "$APP_BOT"
          git config user.email "$(gh api "users/$APP_BOT" --jq .id)+$APP_BOT@users.noreply.github.com"
          python3 .github/scripts/update_submodules.py --repo "$GITHUB_REPOSITORY"
